[project]
name = "bodha-coder"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy[asyncio]==2.1.9",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "email-validator==2.4.0",
    "PyJWT==2.15.1",
    "cryptography==50.0.2",
    "bcrypt==5.0.0",
    "PyOTP==2.12.1",
    "qrcode==8.2",
    "python-multipart==0.0.34",
    "pypdf==7.1.1",
    "reportlab==5.1.2",
    "google-genai==3.6.1",
    "boto3==1.44.12",
    "httpx==0.28.1",
    "stripe==17.1.0",
    "tzdata==2026.6",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.17.6"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.codes" = ["data/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"app/codes/cms_mips_2026.py" = ["E501"]
"app/codes/mips_reporting_codes.py" = ["E501"]
"app/codes/mips_catalog.py" = ["E501"]

[tool.ruff.format]
exclude = ["app/codes/cms_mips_2026.py", "app/codes/mips_reporting_codes.py", "app/codes/mips_catalog.py", "app/codes/catalog_pfs.py"]
