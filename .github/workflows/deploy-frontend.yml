name: deploy-frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  vercel:
    if: github.repository == 'CHARTMATE-APP/bodha-coder' && vars.VERCEL_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the Vercel token
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::Store a VERCEL_TOKEN repository secret to deploy the frontend to Vercel."
      - if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@65.12.1
      - name: Pull production settings
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
