name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.6
      - run: ruff check tools
      - run: ruff format --check tools
      - run: python tools/hygiene_check.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bodha
          POSTGRES_PASSWORD: bodha
          POSTGRES_DB: bodha_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bodha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://bodha:bodha@localhost:5432/bodha_test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-000
      MFA_ENCRYPTION_KEY: r82y_stK1vWEyUBZPhFP7mD-iRuxW7iR3s-SXmQ3sHU=
      S3_BUCKET: ci-bucket
      COOKIE_SECURE: "true"
      APP_URL: https://app.test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-000
      S3_BUCKET: ci-bucket
    steps:
      - uses: actions/checkout@v5
      - run: docker build --pull --tag bodha-coder-api:ci backend
      - run: docker build --pull --tag bodha-coder-web:ci frontend
      - run: docker run --rm -e SECRET_KEY -e S3_BUCKET bodha-coder-api:ci python -c "import app.main, app.worker"
      - run: test "$(docker run --rm --entrypoint id bodha-coder-api:ci -u)" = 10001
      - run: test "$(docker run --rm --entrypoint id bodha-coder-web:ci -u)" = 1000
      - run: docker run --detach --name web-smoke -e BACKEND_URL=http://api.invalid:8000 -p 127.0.0.1:3000:3000 bodha-coder-web:ci
      - run: curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --output /dev/null http://127.0.0.1:3000/sign-in
      - run: docker exec web-smoke grep -qF http://api.invalid:8000/api/ .next/routes-manifest.json
      - run: sed 's/=.*/=ci-only/' .env.compose.example > .env.compose
      - run: docker compose --env-file .env.compose config --quiet
      - run: docker run --rm --volume "$PWD/tools/load:/scripts:ro" grafana/k6:2.4.0 inspect /scripts/coder_day.js
