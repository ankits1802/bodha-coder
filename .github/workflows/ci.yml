name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.6
      - run: ruff check tools
      - run: ruff format --check tools
      - run: python tools/hygiene_check.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bodha
          POSTGRES_PASSWORD: bodha
          POSTGRES_DB: bodha_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bodha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://bodha:bodha@localhost:5432/bodha_test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-000
      S3_BUCKET: ci-bucket
      COOKIE_SECURE: "true"
      APP_URL: https://app.test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: pytest -q

