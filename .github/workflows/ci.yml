name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    if: github.repository == 'ankits1802/bodha-coder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.6
      - run: ruff check tools infra
      - run: ruff format --check tools infra
      - run: python tools/hygiene_check.py

  backend:
    if: github.repository == 'ankits1802/bodha-coder'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bodha
          POSTGRES_PASSWORD: bodha
          POSTGRES_DB: bodha_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bodha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://bodha:bodha@localhost:5432/bodha_test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-000
      MFA_ENCRYPTION_KEY: r82y_stK1vWEyUBZPhFP7mD-iRuxW7iR3s-SXmQ3sHU=
      S3_BUCKET: ci-bucket
      COOKIE_SECURE: "true"
      APP_URL: https://app.test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --upgrade pip
      - run: pip install uv==0.13.10
      - run: cp requirements.lock "$RUNNER_TEMP/requirements.lock"
      - run: uv pip compile pyproject.toml --extra dev --universal --python-version 3.14 --no-header --no-annotate --quiet --output-file "$RUNNER_TEMP/requirements.lock"
      - run: diff requirements.lock "$RUNNER_TEMP/requirements.lock"
      - run: pip install --requirement requirements.lock
      - run: pip install --no-deps --editable .
      - run: ruff check .
      - run: ruff format --check .
      - run: python ../tools/export_openapi.py
      - run: git diff --exit-code -- ../frontend/openapi.json
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: pytest -q

  frontend:
    if: github.repository == 'ankits1802/bodha-coder'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:types
      - run: git diff --exit-code -- src/lib/api/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    if: github.repository == 'ankits1802/bodha-coder'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bodha
          POSTGRES_PASSWORD: bodha
          POSTGRES_DB: bodha_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bodha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://bodha:bodha@localhost:5432/bodha_e2e
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-000
      MFA_ENCRYPTION_KEY: r82y_stK1vWEyUBZPhFP7mD-iRuxW7iR3s-SXmQ3sHU=
      APP_ENVIRONMENT: staging
      GEMINI_BACKEND: demo
      AI_POLL_SECONDS: "0.5"
      APP_URL: http://localhost:3000
      ADMIN_URL: http://admin.localhost:3000
      SITE_URL: http://localhost:3000
      BACKEND_URL: http://127.0.0.1:8000
      E2E_API_URL: http://127.0.0.1:8000
      COOKIE_SECURE: "false"
      S3_BUCKET: bodha-e2e
      S3_ENDPOINT_URL: http://127.0.0.1:5000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: synthetic
      S3_SECRET_ACCESS_KEY: synthetic
      EMAIL_TRANSPORT: outbox
      SMS_TRANSPORT: outbox
      MAIL_OUTBOX_DIR: /tmp/bodha-e2e/outbox
      E2E_LOGS: /tmp/bodha-e2e/logs
      TERMS_URL: http://localhost:3000/legal/terms
      BAA_URL: http://localhost:3000/legal/baa
      PRIVACY_URL: http://localhost:3000/legal/privacy
      AGREEMENT_VERSION: e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mkdir -p "$MAIL_OUTBOX_DIR" "$E2E_LOGS"
      - run: echo "127.0.0.1 admin.localhost" | sudo tee -a /etc/hosts
      - name: Start the object store
        run: |
          python -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet "moto[server]==5.2.6"
          nohup "$RUNNER_TEMP/moto/bin/moto_server" -H 127.0.0.1 -p 5000 > "$E2E_LOGS/moto.log" 2>&1 &
      - name: Install the API
        working-directory: backend
        run: |
          pip install --requirement requirements.lock
          pip install --no-deps --editable .
      - name: Create the bucket
        env:
          AWS_ACCESS_KEY_ID: synthetic
          AWS_SECRET_ACCESS_KEY: synthetic
          AWS_DEFAULT_REGION: us-east-1
        run: |
          curl --silent --retry 30 --retry-delay 1 --retry-all-errors --output /dev/null http://127.0.0.1:5000/
          aws --endpoint-url "$S3_ENDPOINT_URL" s3api create-bucket --bucket "$S3_BUCKET" > /dev/null
      - name: Start the API and the worker
        working-directory: backend
        run: |
          alembic upgrade head
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips 127.0.0.1 --workers 2 > "$E2E_LOGS/api.log" 2>&1 &
          nohup python -m app.worker > "$E2E_LOGS/worker.log" 2>&1 &
      - name: Build the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps --only-shell chromium
      - name: Start the web app
        working-directory: frontend
        run: |
          nohup npx next start --port 3000 > "$E2E_LOGS/web.log" 2>&1 &
          curl --fail --silent --retry 60 --retry-delay 1 --retry-all-errors --output /dev/null http://127.0.0.1:8000/api/health/ready
          curl --fail --silent --retry 60 --retry-delay 1 --retry-all-errors --output /dev/null http://localhost:3000/sign-in
      - name: Browser journeys
        working-directory: frontend
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: |
            frontend/test-results
            /tmp/bodha-e2e/logs
          retention-days: 7

  images:
    if: github.repository == 'ankits1802/bodha-coder'
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-000
      S3_BUCKET: ci-bucket
    steps:
      - uses: actions/checkout@v5
      - run: docker build --pull --tag bodha-coder-api:ci backend
      - run: docker build --pull --tag bodha-coder-web:ci frontend
      - run: docker run --rm -e SECRET_KEY -e S3_BUCKET bodha-coder-api:ci python -c "import app.main, app.worker"
      - run: test "$(docker run --rm --entrypoint id bodha-coder-api:ci -u)" = 10001
      - run: test "$(docker run --rm --entrypoint id bodha-coder-web:ci -u)" = 1000
      - run: docker run --detach --name web-smoke -e BACKEND_URL=http://api.invalid:8000 -p 127.0.0.1:3000:3000 bodha-coder-web:ci
      - run: curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --output /dev/null http://127.0.0.1:3000/sign-in
      - run: docker exec web-smoke grep -qF http://api.invalid:8000/api/ .next/routes-manifest.json
      - run: sed 's/=.*/=ci-only/' .env.compose.example > .env.compose
      - run: docker compose --env-file .env.compose config --quiet
      - run: docker run --rm --volume "$PWD/tools/load:/scripts:ro" grafana/k6:2.4.0 inspect /scripts/coder_day.js

  infra:
    if: github.repository == 'ankits1802/bodha-coder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.10
          tofu_wrapper: false
      - run: tofu fmt -check -recursive infra/tofu
      - run: |
          for stack in infra/tofu/bootstrap infra/tofu/envs/production; do
            tofu -chdir="$stack" init -backend=false -input=false
            tofu -chdir="$stack" validate
          done
      - run: bash -n infra/deploy/release.sh
