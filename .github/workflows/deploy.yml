name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'CHARTMATE-APP/bodha-coder' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    env:
      TAG: ${{ github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
      ECR_WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
      TASK_FAMILY_PREFIX: ${{ vars.TASK_FAMILY_PREFIX }}
      TASK_SUBNETS: ${{ vars.TASK_SUBNETS }}
      TASK_SECURITY_GROUP: ${{ vars.TASK_SECURITY_GROUP }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ vars.ECR_API_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push the web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          build-args: SITE_URL=${{ vars.SITE_URL }}
          tags: ${{ vars.ECR_WEB_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Migrate and roll out
        run: bash infra/deploy/release.sh
